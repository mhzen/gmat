[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -I../payload/include
test_ignore = native

[env:native]
platform = native@1.2.1
test_framework = custom
test_filter = native
build_flags = -std=c++11 -I../payload/include
